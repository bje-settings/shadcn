name: CI

on:
  pull_request:
    # ready_for_review: a draft skips the A/B comparison, which runs once the
    # pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its running CI. On main a newer push
# queues instead, so a deploy is never cut off mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are a contract: the repo ruleset Require CI (23915809) requires
# build, vitest, types, biome and ab by exact name. A renamed job never reports,
# and every pull request waits on it forever. Update the ruleset with any rename.
# deploy is not required: it runs on pushes to main only. ab is a fan-in over
# one ab-style leg per style, so the required name holds whatever the styles.
jobs:
  # `shadcn build` validates each style's registry.json and every item against
  # the schema.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Build the registries
        run: pnpm build
      - name: Refuse a build that writes no registry for a style
        run: |
          for style in $(jq -r '.upstream.styles[] | sub("^base-"; "")' mirror.config.json); do
            jq -e '.name == "bje" and (.items | length > 0)' "public/r/$style/registry.json"
          done
      # public/r is the site root; each style is a flat registry under
      # /<style>/. The deploy job publishes it once every check passes.
      - name: Upload the registry for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/r

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Validate lefthook.yml
        run: pnpm exec lefthook validate
      - name: Run the vitest suite with coverage at 100
        run: pnpm test
      # vitest thresholds pass over an empty file set, so each style must
      # appear in the report.
      - name: Refuse a coverage report that names no file of a style
        run: |
          for style in $(jq -r '.upstream.styles[] | sub("^base-"; "")' mirror.config.json); do
            jq -e --arg dir "/registry/$style/" '[keys[] | select(contains($dir))] | length > 0' coverage/coverage-summary.json
          done
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      # The A/B harness type-checks its generated inputs, which are not
      # committed.
      - name: Generate the A/B harness inputs
        run: pnpm mirror:build
      # Scripts resolve like node; registry items (hand-written, then each
      # style's) and the A/B harness, as committed and with each style's
      # generated inputs, like a bundler.
      - name: Type-check the TypeScript
        run: |
          pnpm exec tsc -p tsconfig.json
          for project in registry/tsconfig.json registry/*/tsconfig.json ab/tsconfig.json ab/generated/*/tsconfig.json; do
            pnpm exec tsc -p "$project"
          done

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Lint and format-check with Biome
        run: pnpm exec biome ci . --error-on-warnings

  # The styles the ab-style legs compare, one each, from mirror.config.json.
  ab-styles:
    name: ab-styles
    runs-on: ubuntu-latest
    outputs:
      styles: ${{ steps.list.outputs.styles }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mirror.config.json
          sparse-checkout-cone-mode: false
      - name: List the styles
        id: list
        # Assigned first, so a jq failure fails the step.
        run: |
          styles=$(jq -c '[.upstream.styles[] | sub("^base-"; "")]' mirror.config.json)
          echo "styles=$styles" >> "$GITHUB_OUTPUT"

  # Visual A/B: every generated component of one style against upstream
  # shadcn with Tailwind, pixel for pixel. Uses the Chrome preinstalled on
  # GitHub's Ubuntu image, so no browser download: both sides render in the
  # same browser in the same run, so its version does not matter.
  ab-style:
    name: ab-style (${{ matrix.style }})
    needs: ab-styles
    runs-on: ubuntu-latest
    strategy:
      # One style's failure does not cancel the others' comparisons.
      fail-fast: false
      matrix:
        style: ${{ fromJSON(needs.ab-styles.outputs.styles) }}
    env:
      AB_STYLE: ${{ matrix.style }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its base, to list what a pull request changes.
          fetch-depth: 2
      # A draft pull request skips the comparison until it is marked ready,
      # as does one that changes only files no A/B case renders or builds
      # from (docs, unit tests, lint and hook config), or only another style's
      # output and snapshots. The leg still reports, and a draft cannot merge.
      # Anything else runs it, as does every push to main.
      - name: Decide whether the comparison runs
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.pull_request.draft }}" = true ]; then
            echo "Draft pull request: comparison skipped until it is marked ready." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(jq -r --arg own "$AB_STYLE" '[.upstream.styles[] | sub("^base-"; "") | select(. != $own)] | join("|")' mirror.config.json)
          # One command per assignment, so a failed diff or grep fails the leg
          # rather than reading as no change. grep's exit 1 (nothing left) is
          # the only failure allowed.
          changed=$(git diff --name-only HEAD^1 HEAD)
          relevant=$(printf '%s\n' "$changed" | grep -Ev \
            '(^$|\.md$|^\.claude/|\.test\.tsx?$|^lefthook\.yml$|^biome\.json$|^vitest\.config\.ts$)' \
            || [ $? -eq 1 ])
          if [ -n "$others" ]; then
            relevant=$(printf '%s\n' "$relevant" | grep -Ev "^(registry/|upstream/base-)($others)/" || [ $? -eq 1 ])
          fi
          if [ -n "$relevant" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches a $AB_STYLE A/B case: comparison skipped." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/node-pnpm
        if: steps.scope.outputs.run == 'true'
      # `pnpm ab` generates the harness inputs first (preab).
      - name: Compare generated components with upstream
        if: steps.scope.outputs.run == 'true'
        run: pnpm ab
      - name: Summarize A/B timings
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: pnpm -s ab:timings | tee -a "$GITHUB_STEP_SUMMARY"
      # In CI the report holds only the failed comparisons' images.
      - name: Upload the A/B report
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ab-report-${{ matrix.style }}
          path: ab/report/${{ matrix.style }}
          # A report under another name means the run compared another style.
          if-no-files-found: error
          retention-days: 14

  # The required ab check. It runs whatever happened above, so it reports even
  # when a leg was skipped or never started, and passes only when listing the
  # styles succeeded and every leg passed or skipped its comparison.
  ab:
    name: ab
    if: always()
    needs: [ab-styles, ab-style]
    runs-on: ubuntu-latest
    steps:
      - name: Require every style's comparison to pass
        env:
          STYLES: ${{ needs.ab-styles.result }}
          LEGS: ${{ needs.ab-style.result }}
        run: |
          echo "ab-styles: $STYLES, ab-style: $LEGS"
          [ "$STYLES" = success ] && [ "$LEGS" = success ]

  # Publishes the build job's public/r to GitHub Pages at shadcn.bje.co, only
  # from main and only once every required check passes.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, vitest, types, biome, ab]
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: contents: read lets the site
    # check check out mirror.config.json for the style list.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mirror.config.json
          sparse-checkout-cone-mode: false
      - name: Refuse a site that serves no registry for a style
        run: |
          for style in $(jq -r '.upstream.styles[] | sub("^base-"; "")' mirror.config.json); do
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://shadcn.bje.co/$style/registry.json" \
              | jq -e '.name == "bje" and (.items | length > 0)'
          done
