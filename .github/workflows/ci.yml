name: CI

on:
  pull_request:
    # ready_for_review: a draft skips the A/B comparison, which runs once the
    # pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its running CI. On main a newer push
# queues instead, so a deploy is never cut off mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are a contract: the repo ruleset Require CI (23915809) requires
# build, vitest, types, biome and ab by exact name. A renamed job never reports,
# and every pull request waits on it forever. Update the ruleset with any rename.
# deploy is not required: it runs on pushes to main only. vitest and ab are
# fan-ins over legs per style, so the required names hold whatever the styles.
# install is not required either, until it has proven stable (issue #13).
jobs:
  # `shadcn build` validates each style's registry.json and every item against
  # the schema.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Build the registries
        run: pnpm build
      - name: Refuse a build that writes no registry for a style
        run: |
          for style in $(jq -r '.upstream.styles[] | sub("^base-"; "")' mirror.config.json); do
            jq -e '.name == "bje" and (.items | length > 0)' "public/r/$style/registry.json"
          done
      # public/r is the site root; each style is a flat registry under
      # /<style>/. The deploy job publishes it once every check passes.
      - name: Upload the registry for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/r

  # The vitest legs: one per style (its registry/<style> and generated/<style>
  # projects), and one for the rest (scripts and registry/lib).
  vitest-legs:
    name: vitest-legs
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mirror.config.json
          sparse-checkout-cone-mode: false
      - name: List the legs
        id: list
        # Assigned first, so a jq failure fails the step.
        run: |
          legs=$(jq -c '[.upstream.styles[] | sub("^base-"; "")] + ["shared"]' mirror.config.json)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  # Each leg runs its vitest projects and keeps its results and coverage as a
  # blob for the vitest job to merge. Thresholds are off here: one leg covers
  # only part of the code, and the merged report holds them at 100.
  vitest-leg:
    name: vitest-leg (${{ matrix.leg }})
    needs: vitest-legs
    runs-on: ubuntu-latest
    strategy:
      # One leg's failure does not cancel the others.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.vitest-legs.outputs.legs) }}
    env:
      LEG: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Validate lefthook.yml
        if: matrix.leg == 'shared'
        run: pnpm exec lefthook validate
      # One run per leg keeps its results and coverage as one blob, with
      # thresholds off and a one-line coverage summary.
      - name: Run the leg's tests
        run: |
          if [ "$LEG" = shared ]; then
            projects=(--project scripts --project registry/lib)
          else
            projects=(--project "registry/$LEG" --project "generated/$LEG")
          fi
          pnpm exec vitest run "${projects[@]}" --coverage --coverage.reporter=text-summary \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 \
            --reporter=default --reporter=blob --outputFile.blob="vitest-reports/$LEG.json"
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.leg }}
          path: vitest-reports/
          if-no-files-found: error
          retention-days: 1

  # The required vitest check. It runs whatever happened above, so it reports
  # even when a leg failed or never started, and passes only when every leg
  # passed and their merged coverage is 100.
  vitest:
    name: vitest
    if: always()
    needs: [vitest-legs, vitest-leg]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Require every leg to pass
        env:
          LEGS: ${{ needs.vitest-legs.result }}
          RUNS: ${{ needs.vitest-leg.result }}
        run: |
          echo "vitest-legs: $LEGS, vitest-leg: $RUNS"
          [ "$LEGS" = success ] && [ "$RUNS" = success ]
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: vitest-reports
      # Thresholds and reporters come from vitest.config.ts, as in `pnpm test`.
      - name: Merge the legs' results and enforce coverage at 100
        run: pnpm exec vitest run --merge-reports=vitest-reports --coverage
      # vitest thresholds pass over an empty file set, so every leg's code
      # must appear in the report: each style's, registry/lib and scripts.
      - name: Refuse a coverage report that misses a leg
        # Assigned first: a failed substitution in the for list would not
        # fail the step.
        run: |
          styles=$(jq -er '.upstream.styles[] | sub("^base-"; "") | "registry/\(.)"' mirror.config.json)
          for dir in $styles registry/lib scripts; do
            jq -e --arg dir "/$dir/" '[keys[] | select(contains($dir))] | length > 0' coverage/coverage-summary.json
          done
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      # The A/B harness type-checks its generated inputs, which are not
      # committed.
      - name: Generate the A/B harness inputs
        run: pnpm mirror:build
      # Scripts resolve like node; registry items (hand-written, then each
      # style's) and the A/B harness, as committed and with each style's
      # generated inputs, like a bundler.
      - name: Type-check the TypeScript
        run: |
          pnpm exec tsc -p tsconfig.json
          for project in registry/tsconfig.json registry/*/tsconfig.json ab/tsconfig.json ab/generated/*/tsconfig.json; do
            pnpm exec tsc -p "$project"
          done

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Lint and format-check with Biome
        run: pnpm exec biome ci . --error-on-warnings

  # The styles the ab-style legs compare, one each, from mirror.config.json.
  ab-styles:
    name: ab-styles
    runs-on: ubuntu-latest
    outputs:
      styles: ${{ steps.list.outputs.styles }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mirror.config.json
          sparse-checkout-cone-mode: false
      - name: List the styles
        id: list
        # Assigned first, so a jq failure fails the step.
        run: |
          styles=$(jq -c '[.upstream.styles[] | sub("^base-"; "")]' mirror.config.json)
          echo "styles=$styles" >> "$GITHUB_OUTPUT"

  # Visual A/B: every generated component of one style against upstream
  # shadcn with Tailwind, pixel for pixel. Uses the Chrome preinstalled on
  # GitHub's Ubuntu image, so no browser download: both sides render in the
  # same browser in the same run, so its version does not matter.
  ab-style:
    name: ab-style (${{ matrix.style }})
    needs: ab-styles
    runs-on: ubuntu-latest
    strategy:
      # One style's failure does not cancel the others' comparisons.
      fail-fast: false
      matrix:
        style: ${{ fromJSON(needs.ab-styles.outputs.styles) }}
    env:
      AB_STYLE: ${{ matrix.style }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its base, to list what a pull request changes.
          fetch-depth: 2
      # A draft pull request skips the comparison until it is marked ready,
      # as does one that changes only files no A/B case renders or builds
      # from (docs, unit tests, lint and hook config), or only another style's
      # output and snapshots. The leg still reports, and a draft cannot merge.
      # Anything else runs it, as does every push to main.
      - name: Decide whether the comparison runs
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.pull_request.draft }}" = true ]; then
            echo "Draft pull request: comparison skipped until it is marked ready." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(jq -r --arg own "$AB_STYLE" '[.upstream.styles[] | sub("^base-"; "") | select(. != $own)] | join("|")' mirror.config.json)
          # One command per assignment, so a failed diff or grep fails the leg
          # rather than reading as no change. grep's exit 1 (nothing left) is
          # the only failure allowed. A rename lists its source too, so a file
          # moved into one style's output still reaches the others.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          relevant=$(printf '%s\n' "$changed" | grep -Ev \
            '(^$|\.md$|^\.claude/|\.test\.tsx?$|^lefthook\.yml$|^biome\.json$|^vitest\.config\.ts$)' \
            || [ $? -eq 1 ])
          if [ -n "$others" ]; then
            relevant=$(printf '%s\n' "$relevant" | grep -Ev "^(registry/|upstream/base-)($others)/" || [ $? -eq 1 ])
          fi
          if [ -n "$relevant" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches a $AB_STYLE A/B case: comparison skipped." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/node-pnpm
        if: steps.scope.outputs.run == 'true'
      # `pnpm ab` generates the harness inputs first (preab).
      - name: Compare generated components with upstream
        if: steps.scope.outputs.run == 'true'
        run: pnpm ab
      - name: Summarize A/B timings
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: pnpm -s ab:timings | tee -a "$GITHUB_STEP_SUMMARY"
      # In CI the report holds only the failed comparisons' images.
      - name: Upload the A/B report
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ab-report-${{ matrix.style }}
          path: ab/report/${{ matrix.style }}
          # A report under another name means the run compared another style.
          if-no-files-found: error
          retention-days: 14

  # The required ab check. It runs whatever happened above, so it reports even
  # when a leg was skipped or never started, and passes only when listing the
  # styles succeeded and every leg passed or skipped its comparison.
  ab:
    name: ab
    if: always()
    needs: [ab-styles, ab-style]
    runs-on: ubuntu-latest
    steps:
      - name: Require every style's comparison to pass
        env:
          STYLES: ${{ needs.ab-styles.result }}
          LEGS: ${{ needs.ab-style.result }}
        run: |
          echo "ab-styles: $STYLES, ab-style: $LEGS"
          [ "$STYLES" = success ] && [ "$LEGS" = success ]

  # Consumer installs: every item of the first style in upstream.styles, from
  # the built public/r, through `shadcn add` into a scratch Vite + React +
  # TypeScript + Sass project, which is then type-checked, tested and built
  # (scripts/install-check).
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its base, to list what a pull request changes.
          fetch-depth: 2
      # Skipped, still reporting, as an ab-style leg is: on a draft, or when
      # the change reaches no item. Unlike there, component tests count: they
      # ship in the items.
      - name: Decide whether the check runs
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if false && [ "${{ github.event.pull_request.draft }}" = true ]; then
            echo "Draft pull request: install check skipped until it is marked ready." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(jq -r '[.upstream.styles[1:][] | sub("^base-"; "")] | join("|")' mirror.config.json)
          # One command per assignment, so a failed diff or grep fails the job
          # rather than reading as no change.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          relevant=$(printf '%s\n' "$changed" | grep -Ev \
            '(^$|\.md$|^\.claude/|^ab/|^scripts/.*\.test\.ts$|^lefthook\.yml$|^biome\.json$|^vitest\.config\.ts$)' \
            || [ $? -eq 1 ])
          if [ -n "$others" ]; then
            relevant=$(printf '%s\n' "$relevant" | grep -Ev "^(registry/|upstream/base-)($others)/" || [ $? -eq 1 ])
          fi
          if [ -n "$relevant" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches an installed item: install check skipped." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/node-pnpm
        if: steps.scope.outputs.run == 'true'
      - name: Build the registries
        if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - name: Install, type-check, test and build every item
        if: steps.scope.outputs.run == 'true'
        run: pnpm install-check

  # Publishes the build job's public/r to GitHub Pages at shadcn.bje.co, only
  # from main and only once every required check passes.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, vitest, types, biome, ab]
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's: contents: read lets the site
    # check check out mirror.config.json for the style list.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mirror.config.json
          sparse-checkout-cone-mode: false
      - name: Refuse a site that serves no registry for a style
        run: |
          for style in $(jq -r '.upstream.styles[] | sub("^base-"; "")' mirror.config.json); do
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://shadcn.bje.co/$style/registry.json" \
              | jq -e '.name == "bje" and (.items | length > 0)'
          done
