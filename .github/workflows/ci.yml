name: CI

on:
  pull_request:
    # ready_for_review: a draft skips the A/B comparison, which runs once the
    # pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are a contract: the repo ruleset Require CI (23915809) requires
# build, vitest, types, biome and ab by exact name. A renamed job never reports,
# and every pull request waits on it forever. Update the ruleset with any rename.
jobs:
  # `shadcn build` validates registry.json and every item against the schema.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Build the registry
        run: pnpm build
      - name: Refuse a build that writes no registry
        run: jq -e '.name == "bje" and (.items | length > 0)' public/r/registry.json

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Validate lefthook.yml
        run: pnpm exec lefthook validate
      - name: Run the vitest suite with coverage at 100
        run: pnpm test
      # vitest thresholds pass over an empty file set.
      - name: Refuse a coverage report that names no file
        run: jq -e 'del(.total) | length > 0' coverage/coverage-summary.json
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      # The A/B harness type-checks its generated inputs, which are not
      # committed.
      - name: Generate the A/B harness inputs
        run: pnpm mirror:build
      # Three projects: scripts resolve like node; registry items and the A/B
      # harness like a bundler.
      - name: Type-check the TypeScript
        run: |
          pnpm exec tsc -p tsconfig.json
          pnpm exec tsc -p registry/tsconfig.json
          pnpm exec tsc -p ab/tsconfig.json

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-pnpm
      - name: Lint and format-check with Biome
        run: pnpm exec biome ci . --error-on-warnings

  # Visual A/B: every generated component against upstream shadcn with
  # Tailwind, pixel for pixel. Uses the Chrome
  # preinstalled on GitHub's Ubuntu image, so no browser download: both sides
  # render in the same browser in the same run, so its version does not matter.
  ab:
    name: ab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its base, to list what a pull request changes.
          fetch-depth: 2
      # A draft pull request skips the comparison until it is marked ready,
      # as does one that changes only files no A/B case renders or builds
      # from (docs, unit tests, lint and hook config). The job still reports,
      # as the ruleset requires, and a draft cannot merge. Anything else runs
      # it, as does every push to main.
      - name: Decide whether the comparison runs
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.pull_request.draft }}" = true ]; then
            echo "Draft pull request: comparison skipped until it is marked ready." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(git diff --name-only HEAD^1 HEAD | grep -Ev \
            '(\.md$|^\.claude/|\.test\.tsx?$|^lefthook\.yml$|^biome\.json$|^vitest\.config\.ts$)' || true)
          if [ -n "$relevant" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "No change reaches an A/B case: comparison skipped." >> "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/node-pnpm
        if: steps.scope.outputs.run == 'true'
      # `pnpm ab` generates the harness inputs first (preab).
      - name: Compare generated components with upstream
        if: steps.scope.outputs.run == 'true'
        run: pnpm ab
      - name: Summarize A/B timings
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: pnpm -s ab:timings | tee -a "$GITHUB_STEP_SUMMARY"
      # In CI the report holds only the failed comparisons' images.
      - name: Upload the A/B report
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ab-report
          path: ab/report
          retention-days: 14
